services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: portas-abertas:latest
    env_file:
      - .env
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"
    volumes:
      - ./db:/app/db
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
