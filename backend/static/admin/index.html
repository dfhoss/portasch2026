<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Painel administrativo</title>
    <link rel="stylesheet" href="/admin/static/admin.css">
  </head>
  <body>
    <main class="admin-shell">
      <section id="login-view" class="login-view" aria-labelledby="login-title">
        <form id="login-form" class="login-card">
          <h1 id="login-title">Painel administrativo</h1>
          <p>Entre para administrar a agenda do evento.</p>
          <div id="login-message" role="status" aria-live="polite"></div>
          <label for="username">Usuário</label>
          <input id="username" name="username" autocomplete="username" required>
          <label for="password">Senha</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
          <button type="submit">Entrar</button>
        </form>
      </section>

      <section id="editor-view" class="editor-view" hidden aria-labelledby="editor-title">
        <header class="editor-header">
          <h1 id="editor-title">Administração</h1>
          <button id="logout-button" type="button">Sair</button>
        </header>
        <nav aria-label="Seções administrativas">
          <button type="button" data-editor-section="schedule">Programação</button>
          <button type="button" data-editor-section="locations">Locais</button>
          <button type="button" data-editor-section="axes">Eixos</button>
          <button type="button" data-editor-section="account">Minha conta</button>
        </nav>
        <div id="editor-message" role="status" aria-live="polite"></div>
        <section id="editor-content" aria-live="polite">
          <p>Selecione uma seção para começar.</p>
        </section>
      </section>
    </main>

    <dialog id="editor-modal" aria-labelledby="modal-title">
      <h2 id="modal-title">Editar item</h2>
      <div id="modal-content"></div>
      <form method="dialog"><button type="submit">Fechar</button></form>
    </dialog>

    <template id="group-template"><article class="schedule-group"></article></template>
    <template id="activity-template"><article class="schedule-activity"></article></template>
    <template id="session-template"><article class="schedule-session"></article></template>
    <script src="/admin/static/admin.js" defer></script>
  </body>
</html>
