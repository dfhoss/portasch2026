<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Painel administrativo</title>
    <link rel="stylesheet" href="/admin/static/admin.css">
  </head>
  <body>
    <main class="admin-shell">
      <section id="login-view" class="login-view" aria-labelledby="login-title">
        <form id="login-form" class="login-card" autocomplete="off">
          <h1 id="login-title">Painel administrativo</h1>
          <p>Entre para administrar a agenda do evento.</p>
          <label for="username">Usuário</label>
          <input id="username" name="username" autocomplete="username" required>
          <label for="password">Senha</label>
          <input id="password" name="password" type="password" autocomplete="off" required>
          <div id="login-message" role="status" aria-live="polite"></div>
          <button type="submit">Entrar</button>
        </form>
      </section>

      <section id="editor-view" class="editor-view" hidden aria-labelledby="editor-title">
        <aside class="editor-sidebar">
          <header class="editor-header">
            <h1 id="editor-title">Administração</h1>
          </header>
          <nav aria-label="Seções administrativas">
            <button type="button" data-editor-section="schedule"><svg class="sidebar-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>Programação</button>
            <button type="button" data-editor-section="locations"><svg class="sidebar-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s6-5.2 6-11a6 6 0 1 0-12 0c0 5.8 6 11 6 11Z"/><circle cx="12" cy="10" r="2"/></svg>Locais</button>
            <button type="button" data-editor-section="axes"><svg class="sidebar-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 8 4-8 4-8-4 8-4Z"/><path d="m4 12 8 4 8-4M4 17l8 4 8-4"/></svg>Eixos</button>
            <button type="button" data-editor-section="account"><svg class="sidebar-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3"/><path d="M5 20a7 7 0 0 1 14 0"/></svg>Minha conta</button>
            <button id="logout-button" type="button"><svg class="sidebar-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h5M14 8l4 4-4 4M8 12h10"/></svg>Sair</button>
          </nav>
        </aside>
        <div id="editor-message" role="status" aria-live="polite"></div>
        <section id="editor-content" aria-live="polite">
          <header class="content-header">
            <div>
              <p class="eyebrow">Agenda do evento</p>
              <h2>Programação</h2>
            </div>
            <div class="toolbar-actions">
              <button id="add-section" type="button" data-action="add-section">Adicionar seção</button>
              <button id="save-schedule" class="primary-action" type="button" data-action="save-schedule">Salvar programação</button>
            </div>
          </header>
          <div class="schedule-metadata">
            <label for="schedule-version">Versão</label>
            <input id="schedule-version" name="version" type="number" min="1" inputmode="numeric">
            <label for="schedule-date">Data do evento</label>
            <input id="schedule-date" name="eventDate" type="date">
          </div>
          <nav id="section-list" class="section-list" aria-label="Seções da programação"></nav>
          <div class="section-toolbar">
            <button id="add-group" type="button" data-action="add-group">Adicionar grupo</button>
            <button id="add-activity" type="button" data-action="add-activity">Adicionar atividade</button>
          </div>
          <div id="schedule-sections"></div>
        </section>
      </section>
    </main>

    <dialog id="editor-modal" aria-labelledby="modal-title">
      <h2 id="modal-title">Editar item</h2>
      <div id="modal-content"></div>
      <form class="dialog-footer" method="dialog">
        <button id="add-session" type="button" hidden>Adicionar horário</button>
        <button id="modal-apply" class="primary-action" type="submit" hidden>Salvar</button>
      </form>
    </dialog>

    <template id="location-form-template">
      <form id="location-form" class="editor-form">
        <label for="location-name">Nome do local</label>
        <input id="location-name" name="name" required maxlength="200" autocomplete="off">
      </form>
    </template>
    <template id="knowledge-axis-form-template">
      <form id="knowledge-axis-form" class="editor-form">
        <label for="knowledge-axis-name">Nome do eixo</label>
        <input id="knowledge-axis-name" name="name" required maxlength="200" autocomplete="off">
      </form>
    </template>
    <template id="group-template"><article class="schedule-group"></article></template>
    <template id="activity-template"><article class="schedule-activity"></article></template>
    <template id="session-template"><article class="schedule-session"></article></template>
    <script src="/admin/static/admin.js" defer></script>
  </body>
</html>
